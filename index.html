  </div>

  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="assistant-overlay" id="assistantOverlay"></div>

  <script>
    (function () {
      const STORAGE_KEY = 'linofinanzas_web_v1';
      const HOUR = 3600000, DAY = 86400000;
      const ICONS = {
        eyeOpen: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`,
        eyeOff: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>`,
        sparkles: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.287 1.288L3 12l5.8 1.9a2 2 0 0 1 1.288 1.287L12 21l1.9-5.8a2 2 0 0 1 1.287-1.288L21 12l-5.8-1.9a2 2 0 0 1-1.288-1.287Z"/></svg>`,
        plus: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>`,
        calendar: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
        close: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`,
        back: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>`,
        send: `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
        search: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8BA095" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>`,
        arrowDown: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg>`,
        arrowUp: `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`,
        lock: `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`,
        exchange: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>`
      };

      function getDefaultData() {
        const now = Date.now();
        return {
          accounts: [
            { id: 1, name: 'Zelle', currency: 'USD', balance: 420.00, type: 'DIVISA', color: '#741CDD', details: 'Cuenta principal USD' },
            { id: 2, name: 'Efectivo Divisa', currency: 'USD', balance: 215.00, type: 'DIVISA', color: '#27AE60', details: 'Caja física USD' },
            { id: 3, name: 'USDT Binance', currency: 'USDT', balance: 613.50, type: 'DIVISA', color: '#F39C12', details: 'Binance Pay / Wallet' },
            { id: 4, name: 'Banesco', currency: 'VES', balance: 4250.00, type: 'BOLIVARES', color: '#C0392B', details: 'Pago Móvil 0414-2223344' },
            { id: 5, name: 'Mercantil', currency: 'VES', balance: 1800.00, type: 'BOLIVARES', color: '#2980B9', details: 'Cuenta Corriente' },
            { id: 6, name: 'Banco de Venezuela', currency: 'VES', balance: 960.00, type: 'BOLIVARES', color: '#D35400', details: 'Pago Móvil BDV' },
            { id: 7, name: 'Efectivo Bs', currency: 'VES', balance: 500.00, type: 'BOLIVARES', color: '#16A085', details: 'Caja menor en Bolívares' }
          ],
          transactions: [
            { id: 101, type: 'GASTO', amount: 15.00, currency: 'USD', category: 'Comida', description: 'Almuerzo ejecutivo', accountId: 1, accountName: 'Zelle', timestamp: now - HOUR * 2 },
            { id: 102, type: 'GASTO', amount: 200.00, currency: 'VES', category: 'Gasolina', description: 'Combustible vehículo', accountId: 5, accountName: 'Mercantil', timestamp: now - HOUR * 5 },
            { id: 103, type: 'INGRESO', amount: 180.00, currency: 'USD', category: 'Cobro Cliente', description: 'Pago Carlos Pérez', accountId: 1, accountName: 'Zelle', timestamp: now - DAY },
            { id: 104, type: 'GASTO', amount: 50.00, currency: 'USD', category: 'Abono Deuda', description: 'Abono mensual carro', accountId: 2, accountName: 'Efectivo Divisa', timestamp: now - DAY * 2 },
            { id: 105, type: 'GASTO', amount: 65.00, currency: 'USD', category: 'Servicios', description: 'Internet Fibra Óptica', accountId: 1, accountName: 'Zelle', timestamp: now - DAY * 3 },
            { id: 106, type: 'INGRESO', amount: 320.00, currency: 'USD', category: 'Servicios Profesionales', description: 'Consultoría mensual', accountId: 3, accountName: 'USDT Binance', timestamp: now - DAY * 5 }
          ],
          debts: [
            { id: 201, type: 'DEBO', title: 'Deuda 1: Carro', person: 'Taller Mecánico Central', original: 600.00, remaining: 200.00, currency: 'USD', status: 'ABONADA' },
            { id: 202, type: 'DEBO', title: 'Deuda 2: Proveedor', person: 'Distribuidora Central', original: 150.00, remaining: 90.00, currency: 'USD', status: 'ABONADA' },
            { id: 203, type: 'DEBO', title: 'Deuda 3: Mamá', person: 'Familia', original: 100.00, remaining: 30.00, currency: 'USD', status: 'ABONADA' },
            { id: 204, type: 'ME_DEBEN', title: 'Cliente: Carlos Pérez', person: 'Carlos Pérez', original: 120.00, remaining: 70.00, currency: 'USD', status: 'ABONADA' },
            { id: 205, type: 'ME_DEBEN', title: 'Taller Los Ruices', person: 'Taller Los Ruices', original: 145.00, remaining: 145.00, currency: 'USD', status: 'PENDIENTE' }
          ],
          settings: { bcvRate: 54.80, paraleloRate: 62.50, eurRate: 1.08, activeRateType: 'BCV' }
        };
      }

      let db = (() => {
        try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
        return getDefaultData();
      })();
      const saveState = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); } catch (e) {} };

      const ui = {
        tab: 'CUENTAS', isPrivacy: false, debtTab: 'DEBO', txSearch: '', txFilter: 'TODOS',
        dateFilter: { type: 'MES', startDate: null, endDate: null },
        assistantMessages: [{
          isUser: false,
          text: 'Hola, soy tu Asistente Financiero de Linofinanzas.\n\nPuedo auditar tus saldos en Bolívares y Divisas, revisar tus deudas o preparar movimientos desde lo que escribas.\n\nPrueba:\n• "¿Cuánto tengo disponible en total?"\n• "¿Cuánto me deben en dólares?"\n• "¿En qué gasté más esta semana?"\n• "Gasté 150 bolívares en panadería con pago móvil"'
        }]
      };

      const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      const activeRate = () => db.settings.activeRateType === 'PARALELO' ? db.settings.paraleloRate : db.settings.bcvRate;
      const fmtNum = (v) => Number(v || 0).toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const fmtCurrency = (v, c, force = false) => {
        if (ui.isPrivacy && !force) return '••••••';
        const n = fmtNum(v);
        return c === 'USD' ? `$ ${n}` : c === 'VES' ? `Bs ${n}` : c === 'EUR' ? `€ ${n}` : c === 'USDT' ? `₮ ${n}` : `${c} ${n}`;
      };
      const toUsd = (v, c) => c === 'VES' ? (activeRate() > 0 ? v / activeRate() : v) : c === 'EUR' ? v * (db.settings.eurRate || 1.08) : v;
      const convertCurrency = (amt, from, to) => {
        if (from === to) return amt;
        const usd = toUsd(amt, from);
        return to === 'VES' ? usd * activeRate() : to === 'EUR' ? usd / (db.settings.eurRate || 1.08) : usd;
      };
      const fmtDate = (ts) => {
        const d = new Date(ts);
        return d.toLocaleDateString('es-VE', { day: '2-digit', month: 'short' }) + ', ' + d.toLocaleTimeString('es-VE', { hour: '2-digit', minute: '2-digit' });
      };
      const showToast = (msg) => {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        const el = document.createElement('div');
        el.className = 'toast'; el.textContent = msg;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2500);
      };

      function matchesDateFilter(ts) {
        const d = new Date(ts), today = new Date();
        if (ui.dateFilter.type === 'DIA') return d.toDateString() === today.toDateString();
        if (ui.dateFilter.type === 'SEMANA') {
          const s = new Date(); s.setDate(today.getDate() - 6); s.setHours(0, 0, 0, 0);
          const e = new Date(); e.setHours(23, 59, 59, 999);
          return ts >= s.getTime() && ts <= e.getTime();
        }
        if (ui.dateFilter.type === 'MES') return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth();
        if (ui.dateFilter.type === 'RANGO' && ui.dateFilter.startDate) {
          const s = new Date(ui.dateFilter.startDate + 'T00:00:00').getTime();
          const e = new Date((ui.dateFilter.endDate || ui.dateFilter.startDate) + 'T23:59:59').getTime();
          return ts >= s && ts <= e;
        }
        return true;
      }

      function dateFilterLabel() {
        const t = ui.dateFilter.type;
        if (t === 'DIA') return 'Hoy';
        if (t === 'SEMANA') return 'Últimos 7 días';
        if (t === 'MES') return 'Este mes';
        if (t === 'RANGO' && ui.dateFilter.startDate) {
          const s = new Date(ui.dateFilter.startDate + 'T12:00:00').toLocaleDateString('es-VE', { day: '2-digit', month: 'short' });
          const e = new Date((ui.dateFilter.endDate || ui.dateFilter.startDate) + 'T12:00:00').toLocaleDateString('es-VE', { day: '2-digit', month: 'short' });
          return `${s} - ${e}`;
        }
        return 'Rango personalizado';
      }

      const privacyBtn = () => `<button class="icon-circle-btn ${ui.isPrivacy ? 'active-privacy' : ''}" data-action="toggle-privacy" title="Ocultar / Mostrar montos">${ui.isPrivacy ? ICONS.eyeOff : ICONS.eyeOpen}</button>`;
      const assistantBtn = () => `<button class="icon-circle-btn primary-circle" data-action="open-assistant" title="Asistente Virtual">${ICONS.sparkles}</button>`;
      const dateFilterBar = () => {
        const t = ui.dateFilter.type;
        return `
          <div class="filter-wrapper">
            <div class="date-filter-row">
              <div class="segmented-date">
                <button class="seg-btn ${t === 'DIA' ? 'active' : ''}" data-date-filter="DIA">Día</button>
                <button class="seg-btn ${t === 'SEMANA' ? 'active' : ''}" data-date-filter="SEMANA">Semana</button>
                <button class="seg-btn ${t === 'MES' ? 'active' : ''}" data-date-filter="MES">Mes</button>
              </div>
              <button class="calendar-btn ${t === 'RANGO' ? 'active' : ''}" data-action="open-date-range" title="Rango personalizado">${ICONS.calendar}</button>
            </div>
            ${t === 'RANGO' ? `<div class="range-badge"><span>Período: ${dateFilterLabel()}</span><span style="cursor:pointer;display:inline-flex" data-action="clear-date-range">${ICONS.close}</span></div>` : ''}
          </div>`;
      };

      function render() {
        const scroll = document.getElementById('mainScroll');
        document.getElementById('fabRegister').style.display = ui.tab === 'CUENTAS' ? 'inline-flex' : 'none';
        document.querySelectorAll('.nav-btn, .side-nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === ui.tab));
        scroll.innerHTML = ui.tab === 'CUENTAS' ? renderAccounts()
          : ui.tab === 'MOVIMIENTOS' ? renderTransactions()
          : ui.tab === 'DEUDAS' ? renderDebts()
          : renderSummary();
      }

      function renderAccounts() {
        const rate = activeRate();
        const divisas = db.accounts.filter(a => a.type === 'DIVISA');
        const bolivares = db.accounts.filter(a => a.type === 'BOLIVARES');
        const totalUsd = db.accounts.reduce((s, a) => s + toUsd(a.balance, a.currency), 0);
        const totalVes = totalUsd * rate;
        const deboUsd = db.debts.filter(d => d.type === 'DEBO').reduce((s, d) => s + toUsd(d.remaining, d.currency), 0);
        const meDebenUsd = db.debts.filter(d => d.type === 'ME_DEBEN').reduce((s, d) => s + toUsd(d.remaining, d.currency), 0);
        const accRow = (a) => `
          <div class="item-card" data-edit-account="${a.id}" title="Editar cuenta">
            <div class="item-icon-box" style="background:${a.color}1F;color:${a.color};font-weight:800;font-size:13.5px;">${esc(a.name.slice(0, 2).toUpperCase())}</div>
            <div class="item-info"><div class="item-title">${esc(a.name)}</div>${a.details ? `<div class="item-sub">${esc(a.details)}</div>` : ''}</div>
            <div class="item-right"><div class="item-amount">${fmtCurrency(a.balance, a.currency)}</div></div>
          </div>`;

        return `
          <div class="accounts-hero">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
              <div><h1 class="header-title">Linofinanzas</h1><p class="header-subtitle">Cartera personal multimoneda</p></div>
              <div class="header-actions">
                ${privacyBtn()}
                <button class="rate-pill" data-action="open-rate-modal">${ICONS.exchange}<span>${db.settings.activeRateType}: ${rate.toFixed(2)}</span></button>
              </div>
            </div>
            <div class="card patrimonio-card">
              <div class="patrimonio-label">Patrimonio total</div>
              <div class="patrimonio-row">
                <div class="patrimonio-amount">${fmtCurrency(totalUsd, 'USD')}</div>
                <div class="patrimonio-ves">${ui.isPrivacy ? '≈ ••••••' : `≈ ${fmtCurrency(totalVes, 'VES', true)}`}</div>
              </div>
              <div class="debt-quick-grid">
                <div class="debt-quick-box debo" data-action="goto-debo">
                  <div class="mini-circle">${ICONS.arrowDown}</div>
                  <div><div style="font-size:11px;color:#8C342A;font-weight:600;">Debo</div><div style="font-size:14.5px;font-weight:800;color:var(--red);">${fmtCurrency(deboUsd, 'USD')}</div></div>
                </div>
                <div class="debt-quick-box medeben" data-action="goto-medeben">
                  <div class="mini-circle">${ICONS.arrowUp}</div>
                  <div><div style="font-size:11px;color:#1E5638;font-weight:600;">Me deben</div><div style="font-size:14.5px;font-weight:800;color:var(--green);">${fmtCurrency(meDebenUsd, 'USD')}</div></div>
                </div>
              </div>
            </div>
          </div>
          <div class="accounts-columns">
            <div>
              <div class="section-row"><div class="section-title">Divisas</div><button class="link-btn" data-action="open-new-account" data-acc-type="DIVISA">+ Nueva</button></div>
              <div class="list-container">${divisas.length ? divisas.map(accRow).join('') : `<div class="empty-state">Sin cuentas en divisas</div>`}</div>
            </div>
            <div>
              <div class="section-row"><div class="section-title">Bolívares</div><button class="link-btn" data-action="open-new-account" data-acc-type="BOLIVARES">+ Nueva</button></div>
              <div class="list-container">${bolivares.length ? bolivares.map(accRow).join('') : `<div class="empty-state">Sin cuentas en bolívares</div>`}</div>
            </div>
          </div>
          <div class="mobile-util-row">
            <button class="link-btn" data-action="export-json">Exportar respaldo</button>
            <button class="link-btn" style="color:var(--muted)" data-action="reset-demo">Restablecer demo</button>
          </div>`;
      }

      function txRow(tx, canDel = true) {
        const isIn = tx.type === 'INGRESO';
        return `
          <div class="item-card" ${canDel ? `data-delete-tx="${tx.id}" title="Toca para eliminar"` : ''}>
            <div class="item-icon-box" style="background:${isIn ? '#E8F7EE' : '#FDEEEB'};color:${isIn ? '#108B5B' : '#E65142'};">${isIn ? ICONS.arrowUp : ICONS.arrowDown}</div>
            <div class="item-info"><div class="item-title">${esc(tx.description || tx.category)}</div><div class="item-sub">${esc(tx.category)} • ${esc(tx.accountName)}</div></div>
            <div class="item-right"><div class="item-amount ${isIn ? 'income' : 'expense'}">${isIn ? '+' : '-'} ${fmtCurrency(tx.amount, tx.currency)}</div><div class="item-date">${fmtDate(tx.timestamp)}</div></div>
          </div>`;
      }

      function renderTransactions() {
        const list = db.transactions.slice().sort((a, b) => b.timestamp - a.timestamp).filter(tx => {
          if (!matchesDateFilter(tx.timestamp)) return false;
          if (ui.txFilter !== 'TODOS' && tx.type !== ui.txFilter) return false;
          if (ui.txSearch.trim()) {
            const q = ui.txSearch.toLowerCase();
            return (tx.description || '').toLowerCase().includes(q) || (tx.category || '').toLowerCase().includes(q) || (tx.accountName || '').toLowerCase().includes(q);
          }
          return true;
        });
        return `
          <div class="screen-header">
            <div><h1 class="header-title">Movimientos</h1><p class="header-subtitle">Historial de ingresos y gastos de Linofinanzas</p></div>
            <div class="header-actions">${privacyBtn()}${assistantBtn()}</div>
          </div>
          ${dateFilterBar()}
          <div class="search-box"><div class="search-input-wrap">${ICONS.search}<input type="text" id="txSearchInput" placeholder="Buscar concepto, cliente, categoría..." value="${esc(ui.txSearch)}" /></div></div>
          <div class="chips-row">
            <button class="chip-pill ${ui.txFilter === 'TODOS' ? 'active' : ''}" data-tx-filter="TODOS">Todos</button>
            <button class="chip-pill ${ui.txFilter === 'INGRESO' ? 'active' : ''}" data-tx-filter="INGRESO">Ingresos</button>
            <button class="chip-pill ${ui.txFilter === 'GASTO' ? 'active' : ''}" data-tx-filter="GASTO">Gastos</button>
          </div>
          <div class="list-container">${list.length ? list.map(t => txRow(t, true)).join('') : `<div class="empty-state"><b>No hay movimientos en este período</b><div style="font-size:12px;margin-top:4px;">Cambia el rango de fechas o registra uno nuevo.</div></div>`}</div>`;
      }

      function renderDebts() {
        const list = db.debts.filter(d => d.type === ui.debtTab);
        const total = list.reduce((s, d) => s + toUsd(d.remaining, d.currency), 0);
        return `
          <div class="screen-header">
            <div><h1 class="header-title">Deudas</h1><p class="header-subtitle">Control por cobrar y por pagar</p></div>
            <div class="header-actions">${privacyBtn()}${assistantBtn()}<button class="icon-circle-btn primary-circle" data-action="open-new-debt" title="Nueva Deuda">${ICONS.plus}</button></div>
          </div>
          <div class="debts-tabs">
            <button class="debt-tab-btn ${ui.debtTab === 'DEBO' ? 'active' : ''}" data-debt-tab="DEBO">Debo</button>
            <button class="debt-tab-btn ${ui.debtTab === 'ME_DEBEN' ? 'active' : ''}" data-debt-tab="ME_DEBEN">Me deben</button>
          </div>
          <div style="padding:0 20px 14px;">
            <div style="font-size:13px;color:var(--text-2);font-weight:600;">${ui.debtTab === 'DEBO' ? 'Total que debes' : 'Total que te deben'}</div>
            <div style="font-size:28px;font-weight:800;color:${ui.debtTab === 'DEBO' ? 'var(--red)' : 'var(--green)'};">${fmtCurrency(total, 'USD')}</div>
          </div>
          <div class="list-container">
            ${list.length ? list.map(d => {
              const pct = d.original > 0 ? Math.min(100, Math.round((Math.max(0, d.original - d.remaining) / d.original) * 100)) : 0;
              const paid = d.remaining <= 0.001;
              return `
                <div class="debt-card">
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
                    <div style="flex:1;min-width:0;">
                      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span style="font-size:15px;font-weight:700;">${esc(d.title)}</span>
                        ${paid ? `<span style="background:#D4EDDA;color:#155724;font-size:9px;font-weight:800;padding:2px 7px;border-radius:8px;">PAGADA</span>` : ''}
                      </div>
                      <div style="font-size:12px;color:var(--muted);margin-top:3px;">${ui.isPrivacy ? `${esc(d.person)} • •••••• restantes` : `${esc(d.person)} • ${d.currency} ${fmtNum(d.remaining)} restantes de ${d.currency} ${fmtNum(d.original)}`}</div>
                    </div>
                    ${!paid ? `<button class="abonar-btn" data-abonar="${d.id}">Abonar</button>` : `<button class="link-btn" style="color:var(--red)" data-delete-debt="${d.id}">Eliminar</button>`}
                  </div>
                  <div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
                    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                    <span style="font-size:11px;font-weight:800;color:var(--green);">${pct}%</span>
                  </div>
                </div>`;
            }).join('') : `<div class="empty-state"><b>Sin registros</b><div style="font-size:12px;margin-top:4px;">Presiona el botón circular + arriba para añadir una deuda.</div></div>`}
          </div>`;
      }

      function renderSummary() {
        const periodTxs = db.transactions.filter(tx => matchesDateFilter(tx.timestamp)).sort((a, b) => b.timestamp - a.timestamp);
        let incomeUsd = 0, expenseUsd = 0;
        const catTotals = {};
        periodTxs.forEach(tx => {
          const u = toUsd(tx.amount, tx.currency);
          if (tx.type === 'INGRESO') incomeUsd += u;
          else if (tx.type === 'GASTO') { expenseUsd += u; catTotals[tx.category] = (catTotals[tx.category] || 0) + u; }
        });
        const maxV = Math.max(1, incomeUsd, expenseUsd);
        const inPct = incomeUsd > 0 ? Math.max(12, Math.round((incomeUsd / maxV) * 86)) : 8;
        const exPct = expenseUsd > 0 ? Math.max(12, Math.round((expenseUsd / maxV) * 86)) : 8;
        const colors = ['#27AE60', '#F1C40F', '#3498DB', '#E67E22', '#9B59B6', '#1ABC9C', '#E74C3C'];
        const cats = Object.entries(catTotals).sort((a, b) => b[1] - a[1]).map(([cat, amount], i) => ({ cat, amount, color: colors[i % colors.length] }));
        const r = 54, circ = 2 * Math.PI * r;
        let offset = 0;
        const arcs = expenseUsd > 0.001 && cats.length
          ? cats.map(c => {
              const frac = c.amount / expenseUsd, dash = Math.max(0, frac * circ - 4);
              const seg = `<circle cx="75" cy="75" r="${r}" fill="none" stroke="${c.color}" stroke-width="18" stroke-linecap="round" stroke-dasharray="${dash} ${circ}" stroke-dashoffset="${-offset}" transform="rotate(-90 75 75)" />`;
              offset += frac * circ; return seg;
            }).join('')
          : `<circle cx="75" cy="75" r="${r}" fill="none" stroke="#E0E6E2" stroke-width="18" />`;

        return `
          <div class="screen-header"><h1 class="header-title">Resumen</h1><div class="header-actions">${privacyBtn()}${assistantBtn()}</div></div>
          ${dateFilterBar()}
          <div class="summary-stack">
            <div class="summary-charts-grid">
              <div class="card">
                <div style="font-size:15px;font-weight:800;">Balance (${dateFilterLabel()})</div>
                <div class="balance-grid">
                  <div style="display:flex;flex-direction:column;gap:10px;">
                    <div class="stat-mini-box in">${ICONS.arrowUp}<div><div style="font-size:11px;color:#1E5638;font-weight:600;">Ingresos</div><div style="font-size:16px;font-weight:800;">${fmtCurrency(incomeUsd, 'USD')}</div></div></div>
                    <div class="stat-mini-box out">${ICONS.arrowDown}<div><div style="font-size:11px;color:#8C342A;font-weight:600;">Gastos</div><div style="font-size:16px;font-weight:800;">${fmtCurrency(expenseUsd, 'USD')}</div></div></div>
                  </div>
                  <div class="bars-container">
                    <div class="bar-col"><div class="bar-val" style="color:var(--green);">${fmtCurrency(incomeUsd, 'USD')}</div><div class="bar-rect" style="height:${inPct}px;background:#27AE60;"></div><div class="bar-label">Ingresos</div></div>
                    <div class="bar-col"><div class="bar-val" style="color:var(--red);">${fmtCurrency(expenseUsd, 'USD')}</div><div class="bar-rect" style="height:${exPct}px;background:#E65142;"></div><div class="bar-label">Gastos</div></div>
                  </div>
                </div>
              </div>
              <div class="card">
                <div style="font-size:15px;font-weight:800;">Gastos por categoría</div>
                <div class="donut-grid">
                  <div class="donut-wrap"><svg width="148" height="148" viewBox="0 0 150 150">${arcs}</svg><div class="donut-center"><div style="font-size:14px;font-weight:800;">${fmtCurrency(expenseUsd, 'USD')}</div><div style="font-size:11px;color:var(--muted);">Gastos</div></div></div>
                  <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:0;">
                    ${cats.length ? cats.slice(0, 5).map(c => `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;"><div style="display:flex;align-items:center;gap:6px;min-width:0;"><span style="width:10px;height:10px;border-radius:50%;background:${c.color};flex-shrink:0;"></span><span style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(c.cat)}</span></div><span style="font-weight:800;">${expenseUsd > 0 ? Math.round((c.amount / expenseUsd) * 100) : 0}%</span></div>`).join('') : `<div style="font-size:12.5px;color:var(--muted);">Sin gastos en este período</div>`}
                  </div>
                </div>
              </div>
            </div>
            <div style="font-size:16px;font-weight:800;margin-top:4px;">Movimientos del período (${periodTxs.length})</div>
            <div style="display:flex;flex-direction:column;gap:8px;">${periodTxs.length ? periodTxs.slice(0, 8).map(t => txRow(t, false)).join('') : `<div class="empty-state">No hay registros en el período seleccionado.</div>`}</div>
          </div>`;
      }

      const backdrop = document.getElementById('modalBackdrop');
      const closeModal = () => { backdrop.classList.remove('open', 'center-modal'); backdrop.innerHTML = ''; };

      function openRegisterModal() {
        const draft = { type: null, accountId: null, amount: '', description: '', category: '', linkedDebtId: null };
        const inCats = ['Venta', 'Cobro Cliente', 'Servicios Profesionales', 'Otros Ingresos'];
        const outCats = ['Comida', 'Gasolina', 'Servicios', 'Repuestos', 'Mantenimiento', 'Abono Deuda', 'Otros'];

        function drawRegister() {
          const s1 = draft.type !== null, s2 = s1 && draft.accountId !== null;
          const parsedAmt = parseFloat((draft.amount || '').replace(',', '.'));
          const s3 = s2 && !isNaN(parsedAmt) && parsedAmt > 0;
          const acc = db.accounts.find(a => a.id === draft.accountId);
          const cur = acc ? acc.currency : 'USD';
          const prefix = cur === 'VES' ? 'Bs ' : cur === 'EUR' ? '€ ' : cur === 'USDT' ? '₮ ' : '$ ';
          const stepTitle = !s1 ? 'Paso 1: Selecciona Ingreso o Gasto' : !s2 ? 'Paso 2: Selecciona el tipo de cuenta' : !s3 ? 'Paso 3: Ingresa el monto' : 'Paso 4: Completa la descripción y guarda';
          const cats = draft.type === 'INGRESO' ? inCats : outCats;
          if (draft.type && !cats.includes(draft.category)) draft.category = cats[0];
          const relDebts = draft.type === 'INGRESO' ? db.debts.filter(d => d.type === 'ME_DEBEN' && d.remaining > 0.001) : draft.type === 'GASTO' ? db.debts.filter(d => d.type === 'DEBO' && d.remaining > 0.001) : [];

          backdrop.classList.remove('center-modal');
          backdrop.innerHTML = `
            <div class="bottom-sheet">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div><div style="font-size:17px;font-weight:800;">Registrar Movimiento</div><div style="font-size:12px;color:var(--green);font-weight:600;margin-top:2px;">${stepTitle}</div></div>
                <button class="icon-circle-btn" id="closeRegBtn">${ICONS.close}</button>
              </div>
              <div class="step-section"><div class="op-grid">
                <button class="op-btn ${draft.type === 'INGRESO' ? 'active-in' : ''}" data-reg-type="INGRESO">Ingreso</button>
                <button class="op-btn ${draft.type === 'GASTO' ? 'active-out' : ''}" data-reg-type="GASTO">Gasto</button>
              </div></div>
              <div class="step-section ${s1 ? '' : 'step-locked'}">
                <div class="step-header"><span class="field-label">Tipo de cuenta</span>${!s1 ? `<span class="lock-hint">${ICONS.lock} Selecciona Ingreso o Gasto</span>` : ''}</div>
                <div class="accounts-chip-grid">${db.accounts.map(a => `
                  <button class="acc-chip ${draft.accountId === a.id ? 'selected' : ''}" data-reg-acc="${a.id}">
                    <div style="width:26px;height:26px;border-radius:50%;background:${a.color}22;color:${a.color};font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;">${esc(a.name.slice(0, 2).toUpperCase())}</div>
                    <div style="min-width:0;"><div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(a.name)}</div><div style="font-size:10px;color:var(--muted);">${a.currency} ${ui.isPrivacy ? '••••' : fmtNum(a.balance)}</div></div>
                  </button>`).join('')}</div>
              </div>
              <div class="step-section ${s2 ? '' : 'step-locked'}">
                <div class="step-header"><span class="field-label">Monto</span>${!s2 ? `<span class="lock-hint">${ICONS.lock} Selecciona una cuenta</span>` : ''}</div>
                <div class="amount-input-box"><span class="amount-prefix">${prefix}</span><input type="number" step="0.01" min="0" id="regAmountInput" placeholder="0.00" value="${esc(draft.amount)}" ${s2 ? '' : 'disabled'} /></div>
              </div>
              <div class="step-section ${s3 ? '' : 'step-locked'}" id="stepDetailsSection">
                <div class="step-header"><span class="field-label">${draft.type === 'INGRESO' ? 'Nombre / Descripción del ingreso' : 'Nombre / Descripción'}</span>${!s3 ? `<span class="lock-hint">${ICONS.lock} Ingresa el monto</span>` : ''}</div>
                <input type="text" class="text-input" id="regDescInput" placeholder="Ej: Pago cliente, Comida, Gasolina..." value="${esc(draft.description)}" ${s3 ? '' : 'disabled'} />
                <div style="margin-top:14px;"><div class="field-label" style="margin-bottom:8px;">Categoría</div>
                  <div style="display:flex;flex-wrap:wrap;gap:6px;">${cats.map(c => `<button class="chip-pill ${draft.category === c ? 'active' : ''}" data-reg-cat="${esc(c)}" style="${draft.category === c ? '' : 'background:#EAF5EE;color:#1B4D35;border-color:transparent;'}">${esc(c)}</button>`).join('')}</div>
                </div>
                ${relDebts.length ? `<div style="margin-top:14px;"><div class="field-label" style="margin-bottom:6px;">${draft.type === 'INGRESO' ? 'Vincular cobro a deuda (opcional)' : 'Vincular abono a deuda (opcional)'}</div><select class="text-input" id="regDebtSelect" ${s3 ? '' : 'disabled'}><option value="">No vincular a deuda</option>${relDebts.map(d => `<option value="${d.id}" ${draft.linkedDebtId === d.id ? 'selected' : ''}>${esc(d.title)} — Resta ${d.currency} ${fmtNum(d.remaining)}</option>`).join('')}</select></div>` : ''}
                <button class="primary-btn" id="saveRegBtn" ${s3 ? '' : 'disabled'} style="background:${draft.type === 'GASTO' ? 'var(--red)' : 'var(--green)'}">${draft.type === 'GASTO' ? 'Guardar gasto' : 'Guardar ingreso'}</button>
              </div>
            </div>`;
          backdrop.classList.add('open');

          document.getElementById('closeRegBtn').onclick = closeModal;
          document.querySelectorAll('[data-reg-type]').forEach(b => b.onclick = () => { draft.type = b.dataset.regType; draft.linkedDebtId = null; drawRegister(); });
          document.querySelectorAll('[data-reg-acc]').forEach(b => b.onclick = () => {
            if (!s1) return; draft.accountId = Number(b.dataset.regAcc); drawRegister();
            setTimeout(() => document.getElementById('regAmountInput')?.focus(), 70);
          });
          document.getElementById('regAmountInput')?.addEventListener('input', (e) => {
            draft.amount = e.target.value;
            const ok = !isNaN(parseFloat(draft.amount.replace(',', '.'))) && parseFloat(draft.amount.replace(',', '.')) > 0;
            document.getElementById('stepDetailsSection').classList.toggle('step-locked', !ok);
            document.getElementById('regDescInput').disabled = !ok;
            const ds = document.getElementById('regDebtSelect'); if (ds) ds.disabled = !ok;
            document.getElementById('saveRegBtn').disabled = !ok;
          });
          document.getElementById('regDescInput')?.addEventListener('input', (e) => { draft.description = e.target.value; });
          document.getElementById('regDebtSelect')?.addEventListener('change', (e) => { draft.linkedDebtId = e.target.value ? Number(e.target.value) : null; });
          document.querySelectorAll('[data-reg-cat]').forEach(b => b.onclick = () => { if (s3) { draft.category = b.dataset.regCat; drawRegister(); } });
          document.getElementById('saveRegBtn').onclick = () => {
            const val = parseFloat((draft.amount || '').replace(',', '.'));
            const selAcc = db.accounts.find(a => a.id === draft.accountId);
            if (!draft.type || !selAcc || isNaN(val) || val <= 0) return;
            selAcc.balance = draft.type === 'INGRESO' ? selAcc.balance + val : selAcc.balance - val;
            let desc = draft.description.trim() || `${draft.category} - ${selAcc.name}`;
            if (draft.linkedDebtId) {
              const ld = db.debts.find(d => d.id === draft.linkedDebtId);
              if (ld) {
                ld.remaining = Math.max(0, ld.remaining - convertCurrency(val, selAcc.currency, ld.currency));
                ld.status = ld.remaining <= 0.001 ? 'PAGADA' : 'ABONADA';
                if (!draft.description.trim()) desc = `Abono: ${ld.title}`;
              }
            }
            db.transactions.unshift({ id: Date.now(), type: draft.type, amount: val, currency: selAcc.currency, category: draft.category, description: desc, accountId: selAcc.id, accountName: selAcc.name, timestamp: Date.now() });
            saveState(); closeModal(); render(); showToast('Movimiento guardado');
          };
        }
        drawRegister();
      }

      function openDateRangeModal() {
        const todayStr = new Date().toISOString().split('T')[0];
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:17px;font-weight:800;">Rango de Fechas</div><button class="icon-circle-btn" id="closeDateBtn">${ICONS.close}</button></div>
            <div style="display:flex;flex-direction:column;gap:12px;">
              <div><div class="field-label" style="margin-bottom:4px;">Fecha de inicio</div><input type="date" class="text-input" id="startDateInput" value="${ui.dateFilter.startDate || todayStr.slice(0, 8) + '01'}" /></div>
              <div><div class="field-label" style="margin-bottom:4px;">Fecha de fin</div><input type="date" class="text-input" id="endDateInput" value="${ui.dateFilter.endDate || todayStr}" /></div>
            </div>
            <button class="primary-btn" id="applyDateRangeBtn">Aplicar rango</button>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeDateBtn').onclick = closeModal;
        document.getElementById('applyDateRangeBtn').onclick = () => {
          const s = document.getElementById('startDateInput').value, e = document.getElementById('endDateInput').value || s;
          if (s) { ui.dateFilter = { type: 'RANGO', startDate: s <= e ? s : e, endDate: s <= e ? e : s }; closeModal(); render(); }
        };
      }

      function openRateModal() {
        let active = db.settings.activeRateType;
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:17px;font-weight:800;">Tasas de Cambio</div><button class="icon-circle-btn" id="closeRateBtn">${ICONS.close}</button></div>
            <div class="op-grid" style="margin-bottom:14px;">
              <button class="op-btn ${active === 'BCV' ? 'active-in' : ''}" id="rateTypeBcv">BCV</button>
              <button class="op-btn ${active === 'PARALELO' ? 'active-in' : ''}" id="rateTypePar">Paralelo</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <div><div class="field-label" style="margin-bottom:4px;">Tasa BCV (Bs por 1 USD)</div><input type="number" step="0.01" class="text-input" id="bcvInput" value="${db.settings.bcvRate}" /></div>
              <div><div class="field-label" style="margin-bottom:4px;">Tasa Paralelo (Bs por 1 USD)</div><input type="number" step="0.01" class="text-input" id="parInput" value="${db.settings.paraleloRate}" /></div>
            </div>
            <button class="primary-btn" id="saveRatesBtn">Guardar Tasas</button>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeRateBtn').onclick = closeModal;
        const bBtn = document.getElementById('rateTypeBcv'), pBtn = document.getElementById('rateTypePar');
        bBtn.onclick = () => { active = 'BCV'; bBtn.classList.add('active-in'); pBtn.classList.remove('active-in'); };
        pBtn.onclick = () => { active = 'PARALELO'; pBtn.classList.add('active-in'); bBtn.classList.remove('active-in'); };
        document.getElementById('saveRatesBtn').onclick = () => {
          const bcv = parseFloat(document.getElementById('bcvInput').value), par = parseFloat(document.getElementById('parInput').value);
          if (bcv > 0) db.settings.bcvRate = bcv; if (par > 0) db.settings.paraleloRate = par;
          db.settings.activeRateType = active; saveState(); closeModal(); render(); showToast('Tasas actualizadas');
        };
      }

      function openAbonarModal(debtId) {
        const debt = db.debts.find(d => d.id === debtId); if (!debt) return;
        let selAccId = (db.accounts.find(a => a.currency === debt.currency) || db.accounts[0]).id;
        backdrop.classList.remove('center-modal');
        backdrop.innerHTML = `
          <div class="bottom-sheet">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><div style="font-size:16px;font-weight:800;">${debt.type === 'DEBO' ? 'Registrar Abono' : 'Registrar Cobro'}</div><button class="icon-circle-btn" id="closeAbonoBtn">${ICONS.close}</button></div>
            <div style="background:#F3F7F5;padding:12px;border-radius:12px;margin-bottom:14px;"><div style="font-weight:700;font-size:14px;">${esc(debt.title)}</div><div style="font-size:12px;color:var(--text-2);">Resta: ${debt.currency} ${fmtNum(debt.remaining)}</div></div>
            <div class="field-label" style="margin-bottom:8px;">Cuenta</div>
            <div class="accounts-chip-grid" style="margin-bottom:14px;">${db.accounts.map(a => `<button class="acc-chip ${selAccId === a.id ? 'selected' : ''}" data-ab-acc="${a.id}"><div><div style="font-size:12px;font-weight:700;">${esc(a.name)}</div><div style="font-size:10px;color:var(--muted);">${a.currency}</div></div></button>`).join('')}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span class="field-label">Monto a abonar</span><button class="link-btn" id="payAllBtn">Pagar todo</button></div>
            <input type="number" step="0.01" class="text-input" id="abonoAmtInput" placeholder="0.00" />
            <button class="primary-btn" id="confirmAbonoBtn">Confirmar Abono</button>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeAbonoBtn').onclick = closeModal;
        document.querySelectorAll('[data-ab-acc]').forEach(b => b.onclick = () => {
          selAccId = Number(b.dataset.abAcc);
          document.querySelectorAll('[data-ab-acc]').forEach(x => x.classList.toggle('selected', Number(x.dataset.abAcc) === selAccId));
        });
        document.getElementById('payAllBtn').onclick = () => {
          const a = db.accounts.find(x => x.id === selAccId);
          document.getElementById('abonoAmtInput').value = convertCurrency(debt.remaining, debt.currency, a.currency).toFixed(2);
        };
        document.getElementById('confirmAbonoBtn').onclick = () => {
          const amt = parseFloat(document.getElementById('abonoAmtInput').value), acc = db.accounts.find(x => x.id === selAccId);
          if (!acc || isNaN(amt) || amt <= 0) return;
          debt.remaining = Math.max(0, debt.remaining - convertCurrency(amt, acc.currency, debt.currency));
          debt.status = debt.remaining <= 0.001 ? 'PAGADA' : 'ABONADA';
          const txType = debt.type === 'DEBO' ? 'GASTO' : 'INGRESO';
          acc.balance = txType === 'GASTO' ? acc.balance - amt : acc.balance + amt;
          db.transactions.unshift({ id: Date.now(), type: txType, amount: amt, currency: acc.currency, category: 'Abono Deuda', description: `Abono: ${debt.title} (${debt.person})`, accountId: acc.id, accountName: acc.name, timestamp: Date.now() });
          saveState(); closeModal(); render(); showToast('Abono registrado');
        };
      }

      function openNewDebtModal() {
        let dType = ui.debtTab;
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:17px;font-weight:800;">Nueva Deuda</div><button class="icon-circle-btn" id="closeNewDebtBtn">${ICONS.close}</button></div>
            <div class="op-grid" style="margin-bottom:12px;"><button class="op-btn ${dType === 'DEBO' ? 'active-out' : ''}" id="ndDebo">Debo</button><button class="op-btn ${dType === 'ME_DEBEN' ? 'active-in' : ''}" id="ndMeDeben">Me deben</button></div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <input type="text" class="text-input" id="ndTitle" placeholder="Título (ej. Carro, Proveedor)" />
              <input type="text" class="text-input" id="ndPerson" placeholder="Persona o entidad" />
              <div style="display:flex;gap:8px;"><input type="number" step="0.01" class="text-input" id="ndAmt" placeholder="Monto" style="flex:1" /><select class="text-input" id="ndCur" style="width:95px;"><option value="USD">USD</option><option value="VES">VES</option><option value="EUR">EUR</option><option value="USDT">USDT</option></select></div>
            </div>
            <button class="primary-btn" id="saveNewDebtBtn">Guardar Deuda</button>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeNewDebtBtn').onclick = closeModal;
        const b1 = document.getElementById('ndDebo'), b2 = document.getElementById('ndMeDeben');
        b1.onclick = () => { dType = 'DEBO'; b1.className = 'op-btn active-out'; b2.className = 'op-btn'; };
        b2.onclick = () => { dType = 'ME_DEBEN'; b2.className = 'op-btn active-in'; b1.className = 'op-btn'; };
        document.getElementById('saveNewDebtBtn').onclick = () => {
          const title = document.getElementById('ndTitle').value.trim(), person = document.getElementById('ndPerson').value.trim() || title;
          const amt = parseFloat(document.getElementById('ndAmt').value), cur = document.getElementById('ndCur').value;
          if (!title || isNaN(amt) || amt <= 0) return;
          db.debts.unshift({ id: Date.now(), type: dType, title, person, original: amt, remaining: amt, currency: cur, status: 'PENDIENTE' });
          ui.debtTab = dType; saveState(); closeModal(); render(); showToast('Deuda registrada');
        };
      }

      function openNewAccountModal(defType = 'DIVISA') {
        const defCur = defType === 'BOLIVARES' ? 'VES' : 'USD';
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:17px;font-weight:800;">Nueva Cuenta</div><button class="icon-circle-btn" id="closeNewAccBtn">${ICONS.close}</button></div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <input type="text" class="text-input" id="naName" placeholder="Nombre (ej. PayPal, Provincial)" />
              <select class="text-input" id="naCur"><option value="USD" ${defCur === 'USD' ? 'selected' : ''}>USD ($)</option><option value="VES" ${defCur === 'VES' ? 'selected' : ''}>VES (Bs)</option><option value="EUR">EUR (€)</option><option value="USDT">USDT</option></select>
              <input type="number" step="0.01" class="text-input" id="naBal" placeholder="Saldo inicial" />
              <input type="text" class="text-input" id="naDet" placeholder="Detalles opcionales" />
            </div>
            <button class="primary-btn" id="saveNewAccBtn">Crear Cuenta</button>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeNewAccBtn').onclick = closeModal;
        document.getElementById('saveNewAccBtn').onclick = () => {
          const name = document.getElementById('naName').value.trim(), currency = document.getElementById('naCur').value;
          const balance = parseFloat(document.getElementById('naBal').value) || 0, details = document.getElementById('naDet').value.trim();
          if (!name) return;
          db.accounts.push({ id: Date.now(), name, currency, balance, type: currency === 'VES' ? 'BOLIVARES' : 'DIVISA', color: currency === 'VES' ? '#2980B9' : '#108B5B', details });
          saveState(); closeModal(); render(); showToast('Cuenta creada');
        };
      }

      function openEditAccountModal(accId) {
        const acc = db.accounts.find(a => a.id === accId); if (!acc) return;
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div style="font-size:17px;font-weight:800;">Editar Cuenta</div><button class="icon-circle-btn" id="closeEditAccBtn">${ICONS.close}</button></div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              <input type="text" class="text-input" id="eaName" value="${esc(acc.name)}" />
              <input type="number" step="0.01" class="text-input" id="eaBal" value="${acc.balance.toFixed(2)}" />
              <input type="text" class="text-input" id="eaDet" value="${esc(acc.details || '')}" placeholder="Detalles" />
            </div>
            <button class="primary-btn" id="saveEditAccBtn">Guardar Cambios</button>
            ${db.accounts.length > 1 ? `<button class="link-btn" id="delEditAccBtn" style="width:100%;margin-top:10px;color:var(--red);">Eliminar cuenta</button>` : ''}
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('closeEditAccBtn').onclick = closeModal;
        document.getElementById('saveEditAccBtn').onclick = () => {
          const name = document.getElementById('eaName').value.trim(), bal = parseFloat(document.getElementById('eaBal').value);
          if (!name || isNaN(bal)) return;
          acc.name = name; acc.balance = bal; acc.details = document.getElementById('eaDet').value.trim();
          saveState(); closeModal(); render(); showToast('Cuenta actualizada');
        };
        document.getElementById('delEditAccBtn')?.addEventListener('click', () => {
          db.accounts = db.accounts.filter(a => a.id !== acc.id); saveState(); closeModal(); render(); showToast('Cuenta eliminada');
        });
      }

      function openConfirmDialog({ title, message, confirmLabel, onConfirm }) {
        backdrop.classList.add('center-modal');
        backdrop.innerHTML = `
          <div class="center-dialog">
            <div style="font-size:17px;font-weight:800;margin-bottom:8px;">${esc(title)}</div>
            <p style="font-size:13px;color:var(--text-2);margin:0 0 18px;line-height:1.45;">${esc(message)}</p>
            <div style="display:flex;gap:10px;">
              <button class="op-btn" id="cancelConfirmBtn" style="flex:1;padding:11px;">Cancelar</button>
              <button class="primary-btn" id="okConfirmBtn" style="flex:1;margin-top:0;padding:11px;background:var(--red);">${esc(confirmLabel)}</button>
            </div>
          </div>`;
        backdrop.classList.add('open');
        document.getElementById('cancelConfirmBtn').onclick = closeModal;
        document.getElementById('okConfirmBtn').onclick = () => { closeModal(); onConfirm(); };
      }

      function processAssistantQuery(query) {
        const q = query.toLowerCase(), rate = activeRate();
        if (q.includes('cuanto tengo') || q.includes('cuánto tengo') || q.includes('disponible') || q.includes('patrimonio')) {
          const totalUsd = db.accounts.reduce((s, a) => s + toUsd(a.balance, a.currency), 0);
          const dList = db.accounts.filter(a => a.type === 'DIVISA').map(a => `• ${a.name}: ${fmtCurrency(a.balance, a.currency, true)}`).join('\n');
          const bList = db.accounts.filter(a => a.type === 'BOLIVARES').map(a => `• ${a.name}: ${fmtCurrency(a.balance, a.currency, true)}`).join('\n');
          return { isUser: false, text: `Auditoría de Patrimonio — Linofinanzas\n\n• Total: ${fmtCurrency(totalUsd, 'USD', true)}\n• En Bs (${db.settings.activeRateType} ${rate.toFixed(2)}): ${fmtCurrency(totalUsd * rate, 'VES', true)}\n\nDivisas:\n${dList}\n\nBolívares:\n${bList}` };
        }
        if (q.includes('me deben')) {
          const items = db.debts.filter(d => d.type === 'ME_DEBEN' && d.remaining > 0.001);
          const tot = items.reduce((s, d) => s + toUsd(d.remaining, d.currency), 0);
          return { isUser: false, text: items.length ? `Cuentas por Cobrar: ${fmtCurrency(tot, 'USD', true)}\n\n` + items.map(d => `• ${d.title}: ${d.currency} ${fmtNum(d.remaining)}`).join('\n') : 'No tienes cuentas por cobrar pendientes.' };
        }
        if (q.includes('cuanto debo') || q.includes('cuánto debo') || q.includes('mis deudas')) {
          const items = db.debts.filter(d => d.type === 'DEBO' && d.remaining > 0.001);
          const tot = items.reduce((s, d) => s + toUsd(d.remaining, d.currency), 0);
          return { isUser: false, text: items.length ? `Cuentas por Pagar: ${fmtCurrency(tot, 'USD', true)}\n\n` + items.map(d => `• ${d.title}: ${d.currency} ${fmtNum(d.remaining)}`).join('\n') : 'No tienes deudas pendientes.' };
        }
        if ((q.includes('gaste') || q.includes('gasté')) && (q.includes('semana') || q.includes('en que') || q.includes('en qué') || q.includes('mas') || q.includes('más'))) {
          const byCat = {}; let tot = 0;
          db.transactions.filter(t => t.type === 'GASTO').forEach(t => { const u = toUsd(t.amount, t.currency); tot += u; byCat[t.category] = (byCat[t.category] || 0) + u; });
          const lines = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `• ${c}: ${fmtCurrency(v, 'USD', true)} (${tot ? Math.round(v / tot * 100) : 0}%)`).join('\n');
          return { isUser: false, text: `Auditoría de Gastos\n\nTotal: ${fmtCurrency(tot, 'USD', true)}\n\n${lines || 'Sin gastos.'}` };
        }
        const isIn = q.includes('cobr') || q.includes('ingres') || q.includes('recib') || q.includes('vend');
        const isOut = q.includes('gast') || q.includes('compr') || q.includes('pagu');
        const num = query.match(/(\d+([.,]\d+)?)/);
        if ((isIn || isOut) && num) {
          const amount = parseFloat(num[1].replace(',', '.'));
          let cur = (q.includes('bolivar') || q.includes('bolívar') || q.includes('bs') || q.includes('ves')) ? 'VES' : q.includes('eur') ? 'EUR' : q.includes('usdt') ? 'USDT' : 'USD';
          const acc = db.accounts.find(a => (q.includes('zelle') && a.name.toLowerCase().includes('zelle')) || ((q.includes('pago movil') || q.includes('pago móvil') || q.includes('banesco')) && a.name.toLowerCase().includes('banesco')) || (q.includes('mercantil') && a.name.toLowerCase().includes('mercantil')) || (q.includes('binance') && a.name.toLowerCase().includes('binance'))) || db.accounts.find(a => a.currency === cur) || db.accounts[0];
          const cat = q.includes('panader') || q.includes('comida') ? 'Comida' : q.includes('gasolina') ? 'Gasolina' : q.includes('servicio') ? 'Servicios' : isIn ? 'Cobro Cliente' : 'Otros';
          return { isUser: false, text: 'Transacción interpretada:', draft: { type: isIn ? 'INGRESO' : 'GASTO', amount, currency: acc.currency, category: cat, description: query.trim(), accountId: acc.id, accountName: acc.name, confirmed: false } };
        }
        return { isUser: false, text: 'Prueba preguntar "¿Cuánto tengo disponible?" o escribir "Gasté 150 bolívares en panadería con pago móvil".' };
      }

      function openAssistant() {
        const overlay = document.getElementById('assistantOverlay');
        function drawAssistant() {
          overlay.innerHTML = `
            <div class="assistant-topbar">
              <button class="icon-circle-btn" id="closeAssistantBtn" style="border:none;">${ICONS.back}</button>
              <div class="icon-circle-btn" style="background:var(--green-soft);color:var(--green);border:none;">${ICONS.sparkles}</div>
              <div><div style="font-size:15px;font-weight:800;color:var(--green-dark);">Asistente Linofinanzas</div><div style="font-size:11px;color:var(--text-2);">Auditoría y Registro Inteligente</div></div>
            </div>
            <div class="chat-messages" id="chatMessages">
              ${ui.assistantMessages.map((m, i) => `
                <div class="bubble ${m.isUser ? 'user' : 'bot'}">${esc(m.text)}</div>
                ${m.draft ? `<div class="draft-card">
                  <div style="font-size:13px;font-weight:800;color:var(--green);margin-bottom:6px;">Borrador Listo</div>
                  <div style="font-size:12.5px;line-height:1.55;">• Tipo: <b>${m.draft.type}</b><br/>• Monto: <b>${m.draft.currency} ${fmtNum(m.draft.amount)}</b><br/>• Cuenta: <b>${esc(m.draft.accountName)}</b><br/>• Categoría: <b>${esc(m.draft.category)}</b></div>
                  ${!m.draft.confirmed ? `<button class="primary-btn" style="margin-top:10px;padding:10px;font-size:13px;" data-confirm-draft="${i}">Confirmar y Guardar</button>` : `<div style="margin-top:10px;background:#D4EDDA;color:#155724;padding:8px;border-radius:8px;text-align:center;font-size:12px;font-weight:700;">Guardado en Linofinanzas</div>`}
                </div>` : ''}
              `).join('')}
            </div>
            <div class="chips-row" style="padding:8px 14px;">
              <button class="chip-pill" data-quick-prompt="¿Cuánto tengo disponible en total?">¿Cuánto tengo?</button>
              <button class="chip-pill" data-quick-prompt="¿Cuánto me deben en dólares?">¿Cuánto me deben?</button>
              <button class="chip-pill" data-quick-prompt="¿En qué gasté más esta semana?">¿En qué gasté más?</button>
              <button class="chip-pill" data-quick-prompt="Gasté 150 bolívares en panadería con pago móvil">Gasté 150 Bs panadería</button>
            </div>
            <div class="assistant-input-bar">
              <input type="text" class="text-input" id="assistantInput" placeholder="Pregunta algo o describe un gasto..." style="border-radius:24px;padding:10px 16px;" />
              <button class="icon-circle-btn primary-circle" id="sendAssistantBtn" style="width:44px;height:44px;flex-shrink:0;">${ICONS.send}</button>
            </div>`;
          document.getElementById('chatMessages').scrollTop = 999999;
          document.getElementById('closeAssistantBtn').onclick = () => { overlay.classList.remove('open'); render(); };
          const send = (t) => { if (!t.trim()) return; ui.assistantMessages.push({ isUser: true, text: t.trim() }, processAssistantQuery(t.trim())); drawAssistant(); };
          document.getElementById('sendAssistantBtn').onclick = () => send(document.getElementById('assistantInput').value);
          document.getElementById('assistantInput').onkeydown = (e) => { if (e.key === 'Enter') send(e.target.value); };
          overlay.querySelectorAll('[data-quick-prompt]').forEach(b => b.onclick = () => send(b.dataset.quickPrompt));
          overlay.querySelectorAll('[data-confirm-draft]').forEach(b => b.onclick = () => {
            const msg = ui.assistantMessages[Number(b.dataset.confirmDraft)]; if (!msg?.draft || msg.draft.confirmed) return;
            const d = msg.draft, acc = db.accounts.find(a => a.id === d.accountId);
            if (acc) acc.balance = d.type === 'INGRESO' ? acc.balance + d.amount : acc.balance - d.amount;
            db.transactions.unshift({ id: Date.now(), ...d, timestamp: Date.now() });
            d.confirmed = true; ui.assistantMessages.push({ isUser: false, text: 'Movimiento guardado y saldos actualizados en Linofinanzas.' });
            saveState(); drawAssistant();
          });
        }
        drawAssistant(); overlay.classList.add('open');
      }

      const handleUtility = (act) => {
        if (act === 'export-json') {
          const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
          a.download = `linofinanzas-respaldo-${new Date().toISOString().slice(0, 10)}.json`; a.click();
          URL.revokeObjectURL(a.href); showToast('Respaldo JSON descargado');
        } else if (act === 'reset-demo') {
          openConfirmDialog({ title: 'Restablecer datos demo', message: 'Se restaurarán las cuentas, movimientos y deudas iniciales en este navegador.', confirmLabel: 'Restablecer', onConfirm: () => { db = getDefaultData(); saveState(); render(); showToast('Datos restablecidos'); } });
        }
      };

      document.getElementById('bottomNav').addEventListener('click', (e) => { const b = e.target.closest('.nav-btn'); if (b) { ui.tab = b.dataset.tab; render(); } });
      document.getElementById('sidebarNav').addEventListener('click', (e) => { const b = e.target.closest('.side-nav-btn'); if (b) { ui.tab = b.dataset.tab; render(); } });
      document.querySelector('.sidebar-footer').addEventListener('click', (e) => { const b = e.target.closest('[data-action]'); if (b) handleUtility(b.dataset.action); });
      document.getElementById('fabRegister').addEventListener('click', openRegisterModal);
      document.getElementById('sidebarRegisterBtn').addEventListener('click', openRegisterModal);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(); });

      document.getElementById('mainScroll').addEventListener('click', (e) => {
        const actEl = e.target.closest('[data-action]');
        if (actEl) {
          const a = actEl.dataset.action;
          if (a === 'toggle-privacy') { ui.isPrivacy = !ui.isPrivacy; render(); }
          else if (a === 'open-assistant') openAssistant();
          else if (a === 'open-rate-modal') openRateModal();
          else if (a === 'open-new-account') openNewAccountModal(actEl.dataset.accType || 'DIVISA');
          else if (a === 'open-new-debt') openNewDebtModal();
          else if (a === 'open-date-range') openDateRangeModal();
          else if (a === 'clear-date-range') { ui.dateFilter = { type: 'MES', startDate: null, endDate: null }; render(); }
          else if (a === 'goto-debo') { ui.debtTab = 'DEBO'; ui.tab = 'DEUDAS'; render(); }
          else if (a === 'goto-medeben') { ui.debtTab = 'ME_DEBEN'; ui.tab = 'DEUDAS'; render(); }
          else handleUtility(a);
          return;
        }
        const editAcc = e.target.closest('[data-edit-account]'); if (editAcc) return openEditAccountModal(Number(editAcc.dataset.editAccount));
        const dBtn = e.target.closest('[data-date-filter]'); if (dBtn) { ui.dateFilter = { type: dBtn.dataset.dateFilter, startDate: null, endDate: null }; return render(); }
        const tfBtn = e.target.closest('[data-tx-filter]'); if (tfBtn) { ui.txFilter = tfBtn.dataset.txFilter; return render(); }
        const dtBtn = e.target.closest('[data-debt-tab]'); if (dtBtn) { ui.debtTab = dtBtn.dataset.debtTab; return render(); }
        const abBtn = e.target.closest('[data-abonar]'); if (abBtn) return openAbonarModal(Number(abBtn.dataset.abonar));
        const ddBtn = e.target.closest('[data-delete-debt]'); if (ddBtn) { db.debts = db.debts.filter(d => d.id !== Number(ddBtn.dataset.deleteDebt)); saveState(); render(); return showToast('Registro eliminado'); }
        const dtEl = e.target.closest('[data-delete-tx]');
        if (dtEl) {
          const tx = db.transactions.find(t => t.id === Number(dtEl.dataset.deleteTx)); if (!tx) return;
          openConfirmDialog({
            title: 'Eliminar movimiento', message: `¿Deseas eliminar "${tx.description}"? Se revertirá el saldo en ${tx.accountName}.`, confirmLabel: 'Eliminar',
            onConfirm: () => {
              const acc = db.accounts.find(a => a.id === tx.accountId);
              if (acc) acc.balance = tx.type === 'INGRESO' ? acc.balance - tx.amount : acc.balance + tx.amount;
              db.transactions = db.transactions.filter(t => t.id !== tx.id); saveState(); render(); showToast('Movimiento eliminado');
            }
          });
        }
      });

      document.getElementById('mainScroll').addEventListener('input', (e) => {
        if (e.target?.id === 'txSearchInput') {
          ui.txSearch = e.target.value; const c = e.target.selectionStart; render();
          const ni = document.getElementById('txSearchInput'); if (ni) { ni.focus(); ni.setSelectionRange(c, c); }
        }
      });

      render();
    })();
  </script>
</body>
</html>

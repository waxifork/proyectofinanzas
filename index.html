<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#108B5B" />
  <meta name="description" content="Linofinanzas — Finanzas personales multimoneda en Bolívares, Dólares, Euros y USDT." />
  <title>Linofinanzas</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23108B5B'/%3E%3Cpath d='M20 18v28h24v-6H27V18h-7z' fill='%23fff'/%3E%3Ccircle cx='43' cy='23' r='5' fill='%23A8F0C6'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --green: #108B5B; --green-hover: #0C724A; --green-dark: #133423;
      --green-soft: #E8F7EE; --red: #E65142; --red-soft: #FDEEEB;
      --bg: #F3F7F5; --surface: #FFFFFF; --border: #D4DFD8; --border-lt: #E4EDE7;
      --text: #152A1F; --text-2: #5E796A; --muted: #7F9488;
      --shadow-sm: 0 2px 8px rgba(19, 52, 35, .05);
      --shadow-md: 0 8px 24px rgba(19, 52, 35, .08);
      --shadow-lg: 0 18px 44px rgba(19, 52, 35, .14);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    button, input, select { font-family: inherit; }
    .web-layout { display: flex; min-height: 100dvh; width: 100%; }
    .sidebar { display: none; }
    .main-area { flex: 1; min-width: 0; position: relative; padding-bottom: 84px; }
    .page-container { width: 100%; max-width: 1080px; margin: 0 auto; }

    /* Headers & Buttons */
    .accounts-hero {
      background: linear-gradient(180deg, #D4EFE0 0%, #EAF5EE 58%, #F3F7F5 100%);
      border-radius: 0 0 28px 28px; padding: 20px 20px 18px;
    }
    .screen-header { padding: 22px 20px 12px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .header-title { font-size: 26px; font-weight: 800; color: var(--green-dark); margin: 0; letter-spacing: -.5px; }
    .header-subtitle { font-size: 12.5px; color: var(--text-2); margin: 3px 0 0; font-weight: 500; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-circle-btn {
      width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border);
      background: var(--surface); color: #52685B; display: inline-flex; align-items: center;
      justify-content: center; cursor: pointer; transition: .16s ease; padding: 0;
    }
    .icon-circle-btn:hover { background: #F8FBF9; border-color: #B8C9BF; }
    .icon-circle-btn:active { transform: scale(.93); }
    .icon-circle-btn.active-privacy { background: var(--green-soft); color: var(--green); border-color: rgba(16,139,91,.4); }
    .icon-circle-btn.primary-circle { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 4px 12px rgba(16,139,91,.28); }
    .icon-circle-btn.primary-circle:hover { background: var(--green-hover); border-color: var(--green-hover); }
    .rate-pill {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.94);
      border: 1px solid var(--border); border-radius: 22px; padding: 8px 13px;
      font-size: 12px; font-weight: 700; color: #19402C; cursor: pointer; transition: .15s ease;
    }
    .rate-pill:hover { box-shadow: var(--shadow-sm); background: #fff; }

    /* Cards & Lists */
    .card {
      background: var(--surface); border-radius: 22px; padding: 18px;
      box-shadow: var(--shadow-sm); border: 1px solid rgba(212,223,216,.45);
    }
    .patrimonio-card { margin-top: 16px; padding: 20px; border-radius: 24px; box-shadow: var(--shadow-md); }
    .patrimonio-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
    .patrimonio-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
    .patrimonio-amount { font-size: 34px; font-weight: 800; letter-spacing: -.9px; }
    .patrimonio-ves { font-size: 14px; font-weight: 700; color: var(--green); background: var(--green-soft); padding: 4px 10px; border-radius: 12px; }
    .debt-quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 18px; }
    .debt-quick-box { border-radius: 14px; padding: 13px 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: .15s ease; }
    .debt-quick-box:active { transform: scale(.98); }
    .debt-quick-box.debo { background: var(--red-soft); }
    .debt-quick-box.medeben { background: var(--green-soft); }
    .mini-circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .debo .mini-circle { background: #FBD7D1; color: var(--red); }
    .medeben .mini-circle { background: #D0F0DC; color: var(--green); }

    .accounts-columns { display: grid; grid-template-columns: 1fr; gap: 6px; padding-bottom: 24px; }
    .section-row { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px 10px; }
    .section-title { font-size: 16px; font-weight: 800; }
    .link-btn { background: none; border: none; color: var(--green); font-weight: 700; font-size: 13px; cursor: pointer; padding: 5px 8px; border-radius: 8px; }
    .link-btn:hover { background: var(--green-soft); }
    .list-container { padding: 0 20px; display: flex; flex-direction: column; gap: 9px; }
    .item-card {
      background: var(--surface); border-radius: 16px; padding: 13px 16px; display: flex; align-items: center; gap: 12px;
      box-shadow: 0 1px 4px rgba(19,52,35,.04); border: 1px solid rgba(212,223,216,.45); cursor: pointer; transition: .14s ease;
    }
    .item-card:hover { background: #FAFDFB; box-shadow: var(--shadow-sm); }
    .item-icon-box { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .item-info { flex: 1; min-width: 0; }
    .item-title { font-size: 14.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { font-size: 11.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-right { text-align: right; flex-shrink: 0; }
    .item-amount { font-size: 14.5px; font-weight: 800; }
    .item-amount.income { color: var(--green); }
    .item-amount.expense { color: var(--red); }
    .item-date { font-size: 10.5px; color: #93A49B; margin-top: 2px; }

    /* Filters, Search, Debts & Charts */
    .filter-wrapper { padding: 4px 20px 12px; }
    .date-filter-row { display: flex; align-items: center; gap: 10px; }
    .segmented-date { flex: 1; max-width: 420px; background: #E4EDE7; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
    .seg-btn { border: none; background: transparent; border-radius: 11px; padding: 9px 6px; font-size: 13px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: .18s ease; }
    .seg-btn.active { background: var(--green); color: #fff; font-weight: 700; box-shadow: 0 2px 6px rgba(16,139,91,.25); }
    .calendar-btn {
      width: 42px; height: 42px; border-radius: 13px; border: 1px solid var(--border); background: var(--surface);
      color: var(--green-dark); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: .18s ease;
    }
    .calendar-btn.active { background: var(--green); color: #fff; border-color: var(--green); }
    .range-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; background: var(--green-soft);
      color: var(--green); padding: 5px 11px; border-radius: 20px; font-size: 11.5px; font-weight: 700;
    }
    .search-box { padding: 0 20px 10px; }
    .search-input-wrap {
      display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border-lt);
      border-radius: 14px; padding: 11px 14px;
    }
    .search-input-wrap input { border: none; outline: none; flex: 1; font-size: 13.5px; color: var(--text); background: transparent; }
    .chips-row { display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; scrollbar-width: none; }
    .chips-row::-webkit-scrollbar { display: none; }
    .chip-pill {
      border: 1px solid var(--border); background: var(--surface); color: #496053; border-radius: 20px;
      padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: .15s ease;
    }
    .chip-pill.active { background: var(--green); color: #fff; border-color: var(--green); }
    .debts-tabs { margin: 4px 20px 14px; max-width: 420px; background: #E4EDE7; border-radius: 14px; padding: 4px; display: grid; grid-template-columns: 1fr 1fr; }
    .debt-tab-btn { border: none; background: transparent; padding: 10px; border-radius: 11px; font-size: 13.5px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: .18s ease; }
    .debt-tab-btn.active { background: var(--surface); color: var(--green-dark); font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.06); }
    .debt-card { background: var(--surface); border-radius: 18px; padding: 16px; box-shadow: var(--shadow-sm); border: 1px solid rgba(212,223,216,.45); }
    .abonar-btn { background: var(--green-soft); color: var(--green); border: none; border-radius: 10px; padding: 8px 14px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
    .progress-track { flex: 1; height: 8px; background: #E8EFEA; border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--green); border-radius: 6px; transition: width .35s ease; }

    .summary-stack { padding: 0 20px 24px; display: flex; flex-direction: column; gap: 14px; }
    .summary-charts-grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; margin-top: 12px; }
    .stat-mini-box { border-radius: 13px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; }
    .stat-mini-box.in { background: var(--green-soft); color: var(--green); }
    .stat-mini-box.out { background: var(--red-soft); color: var(--red); }
    .bars-container { height: 136px; display: flex; align-items: flex-end; justify-content: space-around; padding-top: 16px; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px; }
    .bar-val { font-size: 10.5px; font-weight: 800; white-space: nowrap; }
    .bar-rect { width: 44px; border-radius: 10px 10px 0 0; transition: height .4s ease; min-height: 10px; }
    .bar-label { font-size: 11px; color: var(--text-2); font-weight: 600; }
    .donut-grid { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
    .donut-wrap { position: relative; width: 148px; height: 148px; flex-shrink: 0; }
    .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; }

    /* Mobile Bottom Bar & FAB */
    .fab-register {
      position: fixed; right: 18px; bottom: 82px; background: var(--green); color: #fff; border: none; border-radius: 28px;
      padding: 14px 22px; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; box-shadow: 0 8px 22px rgba(16,139,91,.35); z-index: 30;
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 70px; background: var(--surface);
      border-top: 1px solid var(--border-lt); display: grid; grid-template-columns: repeat(4, 1fr);
      align-items: center; padding: 4px 6px calc(4px + env(safe-area-inset-bottom)); z-index: 25;
    }
    .nav-btn { background: none; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: #6B7E73; font-size: 11px; font-weight: 600; cursor: pointer; padding: 6px 4px; }
    .nav-pill { padding: 4px 16px; border-radius: 16px; display: flex; align-items: center; justify-content: center; transition: .2s ease; }
    .nav-btn.active { color: var(--green); font-weight: 800; }
    .nav-btn.active .nav-pill { background: #D9F2E4; color: var(--green); }
    .mobile-util-row { display: flex; justify-content: center; gap: 12px; padding: 8px 20px 20px; }

    /* Desktop Responsive Layout */
    @media (min-width: 768px) {
      .bottom-nav, .fab-register, .mobile-util-row { display: none !important; }
      .sidebar {
        display: flex; flex-direction: column; width: 256px; background: var(--surface);
        border-right: 1px solid var(--border-lt); padding: 24px 16px; position: sticky; top: 0; height: 100dvh; flex-shrink: 0;
      }
      .brand-box { display: flex; align-items: center; gap: 12px; padding: 4px 8px 22px; }
      .brand-logo {
        width: 40px; height: 40px; border-radius: 13px; background: linear-gradient(135deg, #108B5B, #16A66D);
        color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px;
        box-shadow: 0 6px 14px rgba(16,139,91,.25); flex-shrink: 0;
      }
      .sidebar-cta {
        width: 100%; background: var(--green); color: #fff; border: none; border-radius: 14px; padding: 13px 16px;
        font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;
        cursor: pointer; box-shadow: 0 6px 16px rgba(16,139,91,.25); margin-bottom: 20px;
      }
      .sidebar-cta:hover { background: var(--green-hover); }
      .sidebar-nav { display: flex; flex-direction: column; gap: 6px; flex: 1; }
      .side-nav-btn {
        width: 100%; border: none; background: transparent; border-radius: 12px; padding: 12px 14px;
        display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; color: var(--text-2); cursor: pointer; text-align: left;
      }
      .side-nav-btn:hover { background: #F3F8F5; color: var(--green-dark); }
      .side-nav-btn.active { background: var(--green-soft); color: var(--green); font-weight: 800; }
      .sidebar-footer { border-top: 1px solid var(--border-lt); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
      .side-util-btn {
        width: 100%; background: #F6FAF7; border: 1px solid var(--border-lt); border-radius: 10px; padding: 8px 12px;
        font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; display: flex; align-items: center; gap: 8px;
      }
      .side-util-btn:hover { background: #EAF4EE; color: var(--green-dark); }
      .main-area { padding: 18px 26px 40px; }
      .accounts-hero { border-radius: 26px; padding: 26px; }
      .accounts-columns { grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
      .section-row { padding: 18px 4px 10px; }
      .list-container { padding: 0 4px; }
      .screen-header { padding: 10px 4px 14px; }
      .filter-wrapper, .search-box, .chips-row, .summary-stack { padding-left: 4px; padding-right: 4px; }
      .debts-tabs { margin-left: 4px; margin-right: 4px; }
      .summary-charts-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Modals & Progressive Step-by-Step Form */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(14,34,23,.48); backdrop-filter: blur(4px);
      z-index: 60; display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; animation: fadeIn .18s ease; }
    .modal-backdrop.center-modal { align-items: center; padding: 18px; }
    @media (min-width: 768px) { .modal-backdrop { align-items: center; padding: 20px; } }
    .bottom-sheet {
      width: 100%; max-width: 540px; max-height: 92dvh; background: var(--surface); border-radius: 28px 28px 0 0;
      padding: 22px 22px 26px; overflow-y: auto; box-shadow: var(--shadow-lg); animation: slideUp .22s ease;
    }
    @media (min-width: 768px) { .bottom-sheet { border-radius: 26px; } }
    .center-dialog { width: 100%; max-width: 420px; background: var(--surface); border-radius: 24px; padding: 22px; box-shadow: var(--shadow-lg); }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(36px); opacity: .7; } to { transform: translateY(0); opacity: 1; } }

    .step-section { transition: filter .25s ease, opacity .25s ease; margin-top: 16px; }
    .step-locked { filter: blur(2.5px); opacity: .34; pointer-events: none; user-select: none; }
    .step-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
    .field-label { font-size: 13px; font-weight: 700; color: #415A4C; }
    .lock-hint { font-size: 11px; color: var(--muted); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    .op-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .op-btn {
      padding: 13px; border-radius: 26px; border: 1.5px solid var(--border); background: #F6FAF7;
      font-size: 15px; font-weight: 700; color: #4A6355; cursor: pointer; transition: .18s ease;
    }
    .op-btn.active-in { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 4px 12px rgba(16,139,91,.28); }
    .op-btn.active-out { background: var(--red); color: #fff; border-color: var(--red); box-shadow: 0 4px 12px rgba(230,81,66,.28); }
    .accounts-chip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
    .acc-chip {
      border: 1.5px solid #E1EAE4; background: #fff; border-radius: 13px; padding: 9px 11px;
      display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;
    }
    .acc-chip.selected { background: var(--green-soft); border-color: var(--green); }
    .amount-input-box { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 15px; padding: 10px 14px; background: #FAFDFB; }
    .amount-input-box:focus-within { border-color: var(--green); background: #fff; }
    .amount-prefix { font-size: 23px; font-weight: 800; color: var(--green); margin-right: 8px; }
    .amount-input-box input { border: none; outline: none; width: 100%; font-size: 25px; font-weight: 800; background: transparent; color: var(--text); }
    .text-input { width: 100%; border: 1.5px solid var(--border); border-radius: 13px; padding: 11px 14px; font-size: 14px; color: var(--text); outline: none; background: #FAFDFB; }
    .text-input:focus { border-color: var(--green); background: #fff; }
    .primary-btn {
      width: 100%; border: none; border-radius: 15px; padding: 14px; font-size: 15px; font-weight: 800;
      color: #fff; background: var(--green); cursor: pointer; margin-top: 16px; transition: .18s ease;
    }
    .primary-btn:disabled { opacity: .45; cursor: not-allowed; }

    /* Assistant Drawer */
    .assistant-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 80; display: none; flex-direction: column; }
    .assistant-overlay.open { display: flex; animation: fadeIn .18s ease; }
    @media (min-width: 768px) {
      .assistant-overlay { left: auto; width: 460px; box-shadow: -12px 0 36px rgba(19,52,35,.16); border-left: 1px solid var(--border-lt); }
    }
    .assistant-topbar { background: var(--surface); padding: 14px 16px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border-lt); }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .bubble { max-width: 86%; padding: 12px 15px; border-radius: 18px; font-size: 13.5px; line-height: 1.48; white-space: pre-wrap; }
    .bubble.bot { align-self: flex-start; background: var(--surface); border-top-left-radius: 4px; box-shadow: var(--shadow-sm); }
    .bubble.user { align-self: flex-end; background: var(--green); color: #fff; border-top-right-radius: 4px; }
    .draft-card { background: var(--surface); border: 1.5px solid #BFE3CE; border-radius: 16px; padding: 14px; max-width: 92%; box-shadow: var(--shadow-sm); }
    .assistant-input-bar { background: var(--surface); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--border-lt); }
    .empty-state { background: var(--surface); border-radius: 18px; padding: 28px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--border); }
    .toast {
      position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--green-dark); color: #fff;
      padding: 10px 18px; border-radius: 24px; font-size: 13px; font-weight: 700; z-index: 100; box-shadow: var(--shadow-md);
    }
    @media (min-width: 768px) { .toast { bottom: 26px; } }
  </style>
</head>
<body>
  <div class="web-layout">
    <aside class="sidebar">
      <div class="brand-box">
        <div class="brand-logo">L</div>
        <div>
          <div style="font-size:18px; font-weight:800; color:var(--green-dark); letter-spacing:-.3px;">Linofinanzas</div>
          <div style="font-size:11px; color:var(--text-2); font-weight:600;">Finanzas Personales</div>
        </div>
      </div>

      <button class="sidebar-cta" id="sidebarRegisterBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Registrar movimiento
      </button>

      <nav class="sidebar-nav" id="sidebarNav">
        <button class="side-nav-btn active" data-tab="CUENTAS">

        <span>Cuentas</span>
      </button>
